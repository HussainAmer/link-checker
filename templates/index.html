<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Scanner for SOC | PhishCatch</title>
    <meta name="description" content="نظام ذكي لفحص الروابط واكتشاف هجمات التصيد الاحتيالي باستخدام الذكاء الاصطناعي.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        textarea { resize: vertical; min-height: 120px; }
        /* تصميم شريط التمرير ليناسب بيئة الـ Dark Mode */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
    </style>
    <!-- كود إثبات ملكية جوجل -->
    <meta name="google-site-verification" content="0FPmB1HPQLcQLAQQY6K1TTGvAXFfZyFmDxIusJdvMkE" />
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-start">

    <div class="w-full max-w-5xl space-y-8">
        
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-black text-blue-500 tracking-wide">درع الحماية الذكي <span class="text-slate-400 text-2xl font-bold">(AI Scanner)</span></h1>
            <p class="text-slate-400 text-lg">قم بلصق رسالة الواتساب، الإيميل، أو الرابط بالكامل هنا لفحصه وتفكيكه</p>
        </header>

        <div class="glass-panel p-6 shadow-2xl">
            <textarea id="textInput" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition" placeholder="مثال: عاجل تم إيقاف حسابك البنكي يرجى التحديث عبر الرابط http://fake-bank.com/login"></textarea>
            
            <button id="analyzeBtn" onclick="performAnalysis()" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 rounded-xl transition transform hover:-translate-y-1 shadow-lg flex justify-center items-center gap-2">
                <span id="btnText">فحص وتحليل شامل للرسالة والروابط</span>
                <svg id="loadingIcon" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </div>

        <div id="resultsArea" class="hidden space-y-6">
            
            <div class="glass-panel p-6 shadow-xl">
                <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-700 pb-3">
                    🧠 تحليل محتوى الرسالة (الذكاء الاصطناعي)
                </h2>
                <div id="textDetails" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
            </div>

            <div class="glass-panel p-6 shadow-xl">
                <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-700 pb-3">
                    🔗 التحليل التقني للروابط المرفقة (Heuristics & Live Check)
                </h2>
                <div id="urlDetails" class="space-y-6">
                    </div>
            </div>

        </div>
    </div>

    <script>
        async function performAnalysis() {
            const textInput = document.getElementById('textInput').value.trim();
            if (!textInput) return alert('الرجاء إدخال نص أو رابط للفحص.');

            // تغيير حالة الزر أثناء التحميل
            const btn = document.getElementById('analyzeBtn');
            const btnText = document.getElementById('btnText');
            const loadingIcon = document.getElementById('loadingIcon');
            const resultsArea = document.getElementById('resultsArea');
            
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.innerText = 'جاري التحليل المعمق...';
            loadingIcon.classList.remove('hidden');
            resultsArea.classList.add('hidden');

            try {
                // تذكر تعديل الرابط إذا كنت ترفع على منصة Render
                const response = await fetch('/analyze_full', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textInput })
                });
                
                const data = await response.json();
                renderResults(data);
                resultsArea.classList.remove('hidden');
                
            } catch (error) {
                alert('فشل الاتصال بالخادم. يرجى التأكد من تشغيل in2.py');
            } finally {
                // إعادة الزر لحالته الطبيعية
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.innerText = 'فحص وتحليل شامل للرسالة والروابط';
                loadingIcon.classList.add('hidden');
            }
        }

        function renderResults(data) {
            // 1. معالجة بيانات النص
            const textDiv = document.getElementById('textDetails');
            if (data.text_analysis.analyzed) {
                const isPhishing = data.text_analysis.is_phishing;
                const statusColor = isPhishing ? 'text-red-400' : 'text-emerald-400';
                const statusBg = isPhishing ? 'bg-red-900/20 border-red-500/30' : 'bg-emerald-900/20 border-emerald-500/30';
                const statusText = isPhishing ? '⚠️ رسالة خداع وتصيد (خطر)' : '✅ رسالة آمنة وطبيعية';

                textDiv.innerHTML = `
                    <div class="p-4 rounded-lg border ${statusBg} col-span-1 md:col-span-2">
                        <span class="block text-slate-400 text-sm mb-1">القرار الأمني:</span>
                        <span class="font-bold text-lg ${statusColor}">${statusText}</span>
                    </div>
                    <div class="p-4 rounded-lg bg-slate-800/50 border border-slate-700">
                    <span class="block text-slate-400 text-sm mb-1">مستوى ثقة النظام بالقرار:</span>                        <span class="font-bold text-lg text-white">${data.text_analysis.confidence}%</span>
                    </div>
                    <div class="p-4 rounded-lg bg-slate-800/50 border border-slate-700">
                        <span class="block text-slate-400 text-sm mb-1">اللغة المكتشفة:</span>
                        <span class="font-bold text-lg text-white">${data.text_analysis.language}</span>
                    </div>
                `;
            } else {
                textDiv.innerHTML = `<div class="col-span-2 text-slate-400 p-4">${data.text_analysis.reason || data.text_analysis.error}</div>`;
            }

            // 2. معالجة بيانات الروابط
            const urlDiv = document.getElementById('urlDetails');
            if (data.urls_analysis.length === 0) {
                urlDiv.innerHTML = `<div class="text-slate-400 p-4 bg-slate-800/30 rounded-lg">لم يتم اكتشاف أي روابط داخل هذه الرسالة.</div>`;
            } else {
                urlDiv.innerHTML = '';
                data.urls_analysis.forEach((u, index) => {
                    const riskColor = u.risk_score >= 60 ? 'text-red-400' : (u.risk_score >= 30 ? 'text-yellow-400' : 'text-emerald-400');
                    const reachColor = u.is_reachable ? 'text-emerald-400' : 'text-red-400';
                    const reachText = u.is_reachable ? 'الموقع يعمل (متاح)' : 'الموقع مغلق / لا يستجيب';
                    
                    const reasonsHtml = u.risk_reasons.map(r => `<li class="ml-4 list-disc text-slate-300 text-sm">${r}</li>`).join('');

                    urlDiv.innerHTML += `
                        <div class="p-5 rounded-xl bg-slate-800 border border-slate-600 relative overflow-hidden">
                            <div class="absolute right-0 top-0 bottom-0 w-2 ${u.risk_score >= 60 ? 'bg-red-500' : (u.risk_score >= 30 ? 'bg-yellow-500' : 'bg-emerald-500')}"></div>
                            
                            <div class="mb-4 pr-4 border-b border-slate-700 pb-4">
                                <span class="text-slate-400 text-sm">الرابط المكتشف ${index + 1}:</span>
                                <div class="text-blue-400 font-mono mt-1 break-all">${u.url}</div>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pr-4">
                                <div>
                                    <span class="block text-slate-400 text-sm">مؤشر الخطورة الاستدلالي:</span>
                                    <span class="font-bold text-xl ${riskColor}">${u.risk_score}%</span>
                                    <ul class="mt-2 space-y-1">${reasonsHtml}</ul>
                                </div>
                                
                                <div class="space-y-3 bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                                    <div class="flex justify-between border-b border-slate-700/50 pb-2">
                                        <span class="text-slate-400">النطاق (Domain):</span>
                                        <span class="text-white font-mono text-sm">${u.domain || '-'}</span>
                                    </div>
                                    <div class="flex justify-between border-b border-slate-700/50 pb-2">
                                        <span class="text-slate-400">البروتوكول:</span>
                                        <span class="text-white font-mono text-sm">${u.protocol || '-'}</span>
                                    </div>
                                    <div class="flex justify-between border-b border-slate-700/50 pb-2">
                                        <span class="text-slate-400">رمز الحالة (Status):</span>
                                        <span class="text-white font-mono text-sm">${u.status_code}</span>
                                    </div>
                                    <div class="flex justify-between border-b border-slate-700/50 pb-2">
                                        <span class="text-slate-400">زمن الاستجابة:</span>
                                        <span class="text-white font-mono text-sm">${u.elapsed_seconds > 0 ? u.elapsed_seconds + ' ثانية' : '-'}</span>
                                    </div>
                                    <div class="flex justify-between pt-1">
                                        <span class="text-slate-400">حالة الخادم الآن:</span>
                                        <span class="font-bold text-sm ${reachColor}">${reachText}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        }
    </script>
</body>
</html>
